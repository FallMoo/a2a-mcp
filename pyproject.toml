[project]
name = "a2a-mcp"
version = "0.1.0"
description = "MCP server that bridges MCP clients to A2A (Agent-to-Agent) agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "weixl" },
]
keywords = ["mcp", "a2a", "agent", "model-context-protocol"]
dependencies = [
    "mcp[cli]>=1.0",
    "a2a-sdk[grpc]>=0.3,<2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
a2a-mcp = "a2a_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]